atlas_api_news_create:
    path: /atlas-api/news
    controller: Doublespark\ContaoAtlasBundle\Controller\NewsController::create
    methods: [POST]
    defaults:
        _token_check: false

atlas_api_news_update:
    path: /atlas-api/news/{id}
    controller: Doublespark\ContaoAtlasBundle\Controller\NewsController::update
    # POST as well as PUT: some Doublespark servers' nginx refuses PUT outright (Urban Square, 405, 30 Oct 2026), and Atlas sends POST
    methods: [PUT, POST]
    requirements:
        id: '\d+'
    defaults:
        _token_check: false

atlas_api_news_delete:
    path: /atlas-api/news/{id}/delete
    controller: Doublespark\ContaoAtlasBundle\Controller\NewsController::delete
    # POST, not DELETE: the same servers that refuse PUT are not trusted with DELETE either
    methods: [POST]
    requirements:
        id: '\d+'
    defaults:
        _token_check: false

atlas_api_pages_show:
    path: /atlas-api/pages
    controller: Doublespark\ContaoAtlasBundle\Controller\PagesController::show
    methods: [GET]
    defaults:
        _token_check: false

atlas_api_pages_update:
    path: /atlas-api/pages/{id}
    controller: Doublespark\ContaoAtlasBundle\Controller\PagesController::update
    # POST as well as PUT, for the same servers that refuse PUT
    methods: [PUT, POST]
    requirements:
        id: '\d+'
    defaults:
        _token_check: false

# v0.5, read-only: the image inventory and the variant resolver. GET only; nothing under these two routes writes (the meta route below is the v0.7 write).
atlas_api_images_list:
    path: /atlas-api/images
    controller: Doublespark\ContaoAtlasBundle\Controller\ImagesController::list
    methods: [GET]
    defaults:
        _token_check: false

# v0.7, the one write: set the alt and title of a file or of a placement override (409 with the live values when the site changed since the inventory).
atlas_api_images_meta:
    path: /atlas-api/images/meta
    controller: Doublespark\ContaoAtlasBundle\Controller\ImagesController::meta
    methods: [POST]
    defaults:
        _token_check: false

atlas_api_images_resolve:
    path: /atlas-api/images/resolve
    controller: Doublespark\ContaoAtlasBundle\Controller\ImagesController::resolve
    methods: [GET]
    defaults:
        _token_check: false
