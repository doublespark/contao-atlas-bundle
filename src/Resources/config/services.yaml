services:
    _defaults:
        autoconfigure: true

    Doublespark\ContaoAtlasBundle\Service\NewsWriter:
        arguments:
            - '@database_connection'
            - '@contao.framework'
            - '@?contao.routing.content_url_generator'
            - '%doublespark_contao_atlas.timezone%'
            - '%doublespark_contao_atlas.default_author_id%'
            - '%doublespark_contao_atlas.category_mode%'
            - '%doublespark_contao_atlas.category_column%'

    Doublespark\ContaoAtlasBundle\Controller\NewsController:
        public: true
        arguments:
            - '@Doublespark\ContaoAtlasBundle\Service\NewsWriter'
            - '%doublespark_contao_atlas.token_hash%'
        tags: ['controller.service_arguments']

    Doublespark\ContaoAtlasBundle\Command\MintTokenCommand:
        arguments:
            - '%kernel.project_dir%'
        tags: ['console.command']

    Doublespark\ContaoAtlasBundle\Service\PageMetaWriter:
        arguments:
            - '@database_connection'
            - '@contao.framework'
            - '@?contao.cache.tag_manager'

    Doublespark\ContaoAtlasBundle\Controller\PagesController:
        public: true
        arguments:
            - '@Doublespark\ContaoAtlasBundle\Service\PageMetaWriter'
            - '%doublespark_contao_atlas.token_hash%'
        tags: ['controller.service_arguments']

    Doublespark\ContaoAtlasBundle\Service\ContentUrls:
        arguments:
            - '@contao.framework'
            - '@?contao.routing.content_url_generator'

    Doublespark\ContaoAtlasBundle\Service\ImageInventory:
        arguments:
            - '@database_connection'
            - '@Doublespark\ContaoAtlasBundle\Service\ContentUrls'
            - '%kernel.project_dir%'

    Doublespark\ContaoAtlasBundle\Controller\ImagesController:
        public: true
        arguments:
            - '@Doublespark\ContaoAtlasBundle\Service\ImageInventory'
            - '%doublespark_contao_atlas.token_hash%'
        tags: ['controller.service_arguments']
